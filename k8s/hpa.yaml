# Autoscale 2 -> 4 pods when CPU goes above 70% (k3s includes metrics-server)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shopease
  namespace: shopease
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shopease
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
