# k3s ships with the Traefik ingress controller listening on host port 80.
# This routes http://<ELASTIC-IP>/ to the shopease service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopease
  namespace: shopease
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shopease
                port:
                  number: 80
